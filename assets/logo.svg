<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112" role="img" aria-label="OBS Auto Capture">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b86ff"/>
      <stop offset="1" stop-color="#1d55bd"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="108" height="108" rx="26" fill="url(#g)"/>

  <!-- The window being captured, with its address bar covered. -->
  <rect x="24" y="30" width="64" height="46" rx="6" fill="#ffffff"/>
  <rect x="24" y="30" width="64" height="13" rx="6" fill="#d9e4fb"/>
  <rect x="24" y="37" width="64" height="6" fill="#d9e4fb"/>
  <g fill="#1d55bd" opacity="0.55">
    <rect x="31" y="34" width="14" height="5" rx="2.5"/>
    <rect x="48" y="34" width="9" height="5" rx="2.5"/>
    <rect x="60" y="34" width="20" height="5" rx="2.5"/>
  </g>
  <g fill="#1d55bd" opacity="0.18">
    <rect x="31" y="50" width="34" height="5" rx="2.5"/>
    <rect x="31" y="60" width="50" height="5" rx="2.5"/>
  </g>

  <!-- The corner marks of a capture frame. -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M18 24v-6h6"/>
    <path d="M94 24v-6h-6"/>
    <path d="M18 82v6h6"/>
    <path d="M94 82v6h-6"/>
  </g>
</svg>
